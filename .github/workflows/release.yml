name: Build & Release DMG

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile macOS Application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package into DMG Installer
        run: |
          chmod +x package-dmg.sh
          ./package-dmg.sh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: iPhoneExtendedDisplay-*.dmg
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
